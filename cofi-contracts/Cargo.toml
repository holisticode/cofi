[package]
name = "cofi-contracts"
version = "0.1.0"
edition = "2024"
description = "CoFi contribution-weighted state machine — asset layer and contribution layer"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sled = "0.34"
ed25519-dalek = { version = "2", features = ["serde", "rand_core"] }
rand = "0.8"

[dev-dependencies]
tempfile = "3"
